<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}SetMaker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('pages.styles') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='management.css') }}">
  <script src="{{ url_for('static', filename='management.js') }}" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="{{ url_for('main.dashboard') }}"><span class="logo-mark">S</span>SetMaker</a>
      <nav class="nav">
        <a class="nav-link" href="{{ url_for('main.dashboard') }}">Dashboard</a>
        <a class="nav-link" href="{{ url_for('pages.create_session') }}">Sessions</a>
        <a class="nav-link" href="{{ url_for('pages.players') }}">Players</a>
        <a class="nav-link" href="{{ url_for('pages.courts') }}">Courts</a>
        <a class="nav-link" href="{{ url_for('pages.templates') }}">Templates</a>
        {% if can_manage_records %}<a class="nav-link" href="{{ url_for('pages.accounts') }}">Team members</a>{% endif %}
      </nav>
      <form method="post" action="{{ url_for('auth.logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="btn" type="submit">Log out</button>
      </form>
    </aside>
    <section>
      <p id="page-message" role="status" aria-live="polite"></p>
      {% block content %}{% endblock %}
    </section>
  </div>
</body>
</html>
