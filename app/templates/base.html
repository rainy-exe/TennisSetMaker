<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{% block title %}Setify{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
</head>
<body>
  <div class="app-shell">
    {% include '_sidebar.html' %}

    {% block content %}{% endblock %}
  </div>

  {% block scripts %}{% endblock %}

  {% if page_data is defined %}
  <script id="setmaker-page-data" type="application/json">
    {{ page_data | tojson }}
  </script>
  {% endif %}

  <script src="{{ url_for('static', filename='js/integration.js') }}"></script>

</body>
</html>
