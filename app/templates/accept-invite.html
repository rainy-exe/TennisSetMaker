<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SetMaker | Accept Invitation</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <meta name="referrer" content="no-referrer">
</head>

<body class="login-body">

    <main class="login-page">

        <div class="login-card">

            <!-- =========================
                 LEFT IMAGE
            ========================== -->

            <section class="login-image">

                <div class="login-image-overlay"></div>

                <div class="login-image-content">

                    <div class="landing-brand">

                        <div class="logo-mark">
                            S
                        </div>

                        <span>SetMaker</span>

                    </div>


                    <div class="login-image-text">

                        <h2>
                            Join Your Club
                        </h2>

                        <p>
                            Accept your invitation and help your club
                            organise smoother tennis sessions.
                        </p>

                    </div>

                </div>

            </section>


            <!-- =========================
                 INVITATION PANEL
            ========================== -->

            <section class="login-panel">

                <div class="login-form-wrap invite-form-wrap">

                    <a href="{{ url_for('auth.login_page') }}" class="back-home">
                        ← Back to Log In
                    </a>


                    <!-- Invitation Icon -->
                    <div class="invite-icon">

                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="5" width="18" height="14" rx="2"></rect>

                            <path d="M3 7l9 6 9-6"></path>

                            <path d="M18 3v4"></path>

                            <path d="M16 5h4"></path>
                        </svg>

                    </div>


                    <p class="invite-eyebrow">
                        CLUB INVITATION
                    </p>


                    <h1>
                        You've been invited
                    </h1>


                    <p class="login-subtitle invite-subtitle">
                        Accept your invitation to join this club on SetMaker.
                    </p>


                    <!-- =========================
                         INVITATION DETAILS
                    ========================== -->

                    <div class="invite-details-card">

                        <div class="invite-detail-row">

                            <span>
                                Club
                            </span>

                            <strong id="inviteClubName">
                                —
                            </strong>

                        </div>


                        <div class="invite-detail-row">

                            <span>
                                Role
                            </span>

                            <strong class="invite-role" id="inviteRole">
                                —
                            </strong>

                        </div>


                        <div class="invite-detail-row">

                            <span>
                                Invited Email
                            </span>

                            <strong id="inviteEmail">
                                —
                            </strong>

                        </div>

                    </div>


                    <!-- =========================
                         NEW USER SETUP
                    ========================== -->

                    <form id="acceptInviteForm">
                        <input type="hidden" id="csrfToken" value="{{ csrf_token() }}">

                        <div class="field">

                            <label for="inviteName">
                                Full Name
                            </label>

                            <input type="text" id="inviteName" name="name" class="input" placeholder="Your full name"
                                autocomplete="name" maxlength="120" required>

                        </div>


                        <div class="field">

                            <label for="invitePassword">
                                Password
                            </label>

                            <input type="password" id="invitePassword" name="password" class="input"
                                placeholder="Create a password" autocomplete="new-password" maxlength="128" required>

                        </div>


                        <div class="field">

                            <label for="inviteConfirmPassword">
                                Confirm Password
                            </label>

                            <input type="password" id="inviteConfirmPassword" name="confirmPassword" class="input"
                                placeholder="Confirm your password" autocomplete="new-password" required>

                        </div>

                        <p id="inviteError" role="alert" style="color: #c0392b;" hidden></p>

                        <button type="submit" class="btn btn-primary login-submit">
                            Accept Invitation
                        </button>

                    </form>


                    <p class="invite-login-link">
                        Already have a SetMaker account?

                        <a href="{{ url_for('auth.login_page') }}">
                            Log In
                        </a>
                    </p>

                </div>

            </section>

        </div>

    </main>

<script>
document.getElementById("acceptInviteForm").addEventListener("submit", async function (event) {
    event.preventDefault();

    const fullName = document.getElementById("inviteName").value.trim();
    const password = document.getElementById("invitePassword").value;
    const confirmPassword = document.getElementById("inviteConfirmPassword").value;
    const csrfToken = document.getElementById("csrfToken").value;
    const errorElement = document.getElementById("inviteError");

    const token = new URLSearchParams(window.location.search).get("token");

    const submitButton = this.querySelector('button[type="submit"]');

    errorElement.hidden = true;
    errorElement.textContent = "";

    // Validate the invitation link.
    if (!token) {
        errorElement.textContent = "Invalid invitation link. No token was provided.";
        errorElement.hidden = false;
        return;
    }

    // Check full name.
    if (!fullName || fullName.length > 120) {
        errorElement.textContent = "Please enter a valid full name.";
        errorElement.hidden = false;
        return;
    }

    // Check passwords.
    if (password !== confirmPassword) {
        errorElement.textContent = "Passwords do not match.";
        errorElement.hidden = false;
        return;
    }

    submitButton.disabled = true;
    submitButton.textContent = "Creating account...";

    try {
        const response = await fetch("{{ url_for('auth.accept_invitation') }}", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": csrfToken
            },
            credentials: "same-origin",
            body: JSON.stringify({
                token: token,
                full_name: fullName,
                password: password
            })
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(
                result.message ||
                (typeof result.error === "string" ? result.error : result.error?.message) ||
                "Could not accept invitation."
            );
        }

        // Account created successfully.
        window.location.href = "{{ url_for('main.dashboard') }}";

    } catch (error) {
        errorElement.textContent = error.message;
        errorElement.hidden = false;

        submitButton.disabled = false;
        submitButton.textContent = "Accept Invitation";
    }
});
</script>


</body>

</html>
