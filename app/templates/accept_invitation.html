{% extends "auth_base.html" %}
{% block title %}Join your club | SetMaker{% endblock %}
{% block content %}
<h1>Accept invitation</h1>
<p>Your invitation determines your club, email and role.</p>
<form method="post" action="{{ url_for('auth.accept_invitation') }}" data-auth-form>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="token" value="{{ request.args.get('token', '') }}">
  <label for="password">Choose a password</label>
  <input id="password" name="password" type="password" autocomplete="new-password" maxlength="128" required>
  <button type="submit">Join club</button>
</form>
{% endblock %}
