<div class="two-col">
  <div class="field"><label for="number_of_rounds">Number of Rounds</label><input class="input" id="number_of_rounds" name="number_of_rounds" type="number" min="1" max="50" value="{{ config.number_of_rounds if config else 6 }}" required></div>
  <div class="field"><label for="round_duration_minutes">Round Length (minutes)</label><input class="input" id="round_duration_minutes" name="round_duration_minutes" type="number" min="1" max="240" value="{{ config.round_duration_minutes if config else 30 }}" required></div>
</div>
<div class="field"><label for="session_duration_minutes">Session Duration (minutes)</label><input class="input" id="session_duration_minutes" name="session_duration_minutes" type="number" min="1" max="1440" value="{{ config.session_duration_minutes if config else 180 }}" required></div>
<div class="field"><label for="round_format">Format</label><select class="select" id="round_format" name="round_format">
  <option value="open" {{ 'selected' if not config or config.round_format == 'open' else '' }}>Open doubles (any gender)</option>
  <option value="mixed" {{ 'selected' if config and config.round_format == 'mixed' else '' }}>Mixed doubles</option>
</select></div>
<label><input type="checkbox" name="strict_format" {{ 'checked' if config and config.strict_format else '' }}> Strict mixed format (do not relax if a mixed solution is unavailable)</label>
<div class="field"><label for="tea_break_after_round">Tea break after round (optional)</label><input class="input" type="number" id="tea_break_after_round" name="tea_break_after_round" min="1" value="{{ config.tea_break_after_round if config and config.tea_break_after_round else '' }}"></div>
<p>Same-gender-only format needs an algorithm contract update; it is not treated as open doubles.</p>
<fieldset><legend>Active Courts</legend>
  {% for court in courts if court.active %}
  <label class="choice"><input type="checkbox" data-list name="court_ids" value="{{ court.id }}" {{ 'checked' if config and court.id in config.court_ids else '' }}>Court {{ court.number }} · {{ court.court_type }} · priority {{ court.priority }}</label>
  {% else %}<p>No active courts. An Owner or Admin must add one first.</p>{% endfor %}
</fieldset>
<p>Courts use the persistent priority from Court Management.</p>
