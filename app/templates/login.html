<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>SetMaker | Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
  <script src="{{ url_for('static', filename='auth.js') }}" defer></script>
</head>
<body class="login-body">
  <!-- Preserve Kimi's two-panel login layout from login-page-frontend (#23). -->
  <main class="login-page">
    <div class="login-card">
      <section class="login-image">
        <div class="login-image-overlay"></div>
        <div class="login-image-content">
          <div class="landing-brand"><div class="logo-mark">S</div><span>SetMaker</span></div>
          <div class="login-image-text">
            <h2>Welcome Back</h2>
            <p>Log in to continue creating and managing tennis sessions.</p>
          </div>
        </div>
      </section>
      <section class="login-panel">
        <div class="login-form-wrap">
          <a href="{{ url_for('main.home') }}" class="back-home">← Back to SetMaker</a>
          <h1>Log In</h1>
          <p class="login-subtitle">Enter your details to access your account.</p>
          <form method="post" action="{{ url_for('auth.login') }}" data-auth-form>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="field">
              <label for="email">Email</label>
              <input class="input" id="email" type="email" name="email" autocomplete="username" placeholder="you@example.com" required>
            </div>
            <div class="field">
              <label for="password">Password</label>
              <input class="input" id="password" type="password" name="password" autocomplete="current-password" placeholder="Enter your password" maxlength="128" required>
            </div>
            <div class="login-options"><a href="{{ url_for('auth.forgot_password') }}">Forgot password?</a></div>
            <button class="btn btn-primary login-submit" type="submit">Log In</button>
          </form>
          <p id="form-message" role="status"></p>
          <p><a href="{{ url_for('auth.signup_page') }}">Create a club account</a></p>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
