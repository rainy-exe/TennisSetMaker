<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SetMaker | Login</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body class="login-body">

    <main class="login-page">

        <!-- Login Card -->
        <div class="login-card">

            <!-- Left Image -->
            <section class="login-image">

                <div class="login-image-overlay"></div>

                <div class="login-image-content">

                    <!-- SetMaker Brand -->
                    <div class="landing-brand">

                        <div class="logo-mark">
                            S
                        </div>

                        <span>SetMaker</span>

                    </div>


                    <!-- Image Text -->
                    <div class="login-image-text">

                        <h2>
                            Welcome Back
                        </h2>

                        <p>
                            Log in to continue creating and managing tennis sessions.
                        </p>

                    </div>

                </div>

            </section>


            <!-- Right Login Panel -->
            <section class="login-panel">

                <div class="login-form-wrap">

                    <!-- Back to Main Page -->
                    <a href="{{ url_for('main.home') }}" class="back-home">
                        ← Back to SetMaker
                    </a>


                    <h1>
                        Log In
                    </h1>

                    <p class="login-subtitle">
                        Enter your details to access your account.
                    </p>


                    <!-- Login Form -->
                    <form id="login-form" method="post">

                        <!-- Email -->
                        <div class="field">

                            <label for="email">
                                Email
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                class="input"
                                placeholder="you@example.com"
                                required
                            >

                        </div>


                        <!-- Password -->
                        <div class="field">

                            <label for="password">
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="input"
                                placeholder="Enter your password"
                                required
                            >

                        </div>


                        <!-- Login Options -->
                        <div class="login-options">

                            <label class="remember-me">

                                <input
                                    type="checkbox"
                                    id="rememberMe"
                                    name="rememberMe"
                                >

                                Remember me

                            </label>

                            <a href="{{ url_for('auth.forgot_password') }}">
                                Forgot password?
                            </a>

                        </div>

                        <p id="login-notice" class="form-success" role="status" hidden></p>
                        <p id="login-error" class="form-error" role="alert" hidden></p>

                        <!-- Login Button -->
                        <button
                            type="submit"
                            class="btn btn-primary login-submit"
                        >
                            Log In
                        </button>

                    </form>

                </div>

            </section>

        </div>

    </main>

    
<script>
(function () {
    // Messages shown after being sent here from another page.
    const params = new URLSearchParams(window.location.search);
    let message = "";
    if (params.has("logged_out")) {
        message = "You've been logged out.";
    } else if (params.has("reset")) {
        message = "Your password has been reset. Log in with your new password.";
    } else if (params.get("registered") === "verify") {
        message = "Account created. Log in to get started. We've also emailed you a link to confirm your address.";
    } else if (params.has("registered")) {
        message = "Account created. Log in to get started.";
    }
    if (message) {
        const notice = document.getElementById("login-notice");
        notice.textContent = message;
        notice.hidden = false;
    }
})();

document.getElementById("login-form").addEventListener("submit", async function (event) {
    event.preventDefault();

    const form = event.currentTarget;
    const email = form.querySelector("#email").value.trim();
    const password = form.querySelector("#password").value;
    const remember = form.querySelector("#rememberMe").checked;

    const errorElement = document.getElementById("login-error");
    const submitButton = form.querySelector('button[type="submit"]');

    errorElement.hidden = true;
    errorElement.textContent = "";
    submitButton.disabled = true;

    try {
        // Step 1: Obtain a CSRF token
        const csrfResponse = await fetch("{{ url_for('auth.csrf_token') }}", {
            credentials: "same-origin"
        });

        if (!csrfResponse.ok) {
            throw new Error("Unable to obtain a security token.");
        }

        const csrfData = await csrfResponse.json();

        // Step 2: Send login credentials to Flask
        const response = await fetch("{{ url_for('auth.login') }}", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": csrfData.csrf_token
            },
            credentials: "same-origin",
            body: JSON.stringify({
                email: email,
                password: password,
                remember: remember
            })
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.message || result.error || "Login failed.");
        }

        // Step 3: Redirect after successful authentication
        window.location.href = "{{ url_for('main.dashboard') }}";

    } catch (error) {
        errorElement.textContent = error.message;
        errorElement.hidden = false;

    } finally {
        submitButton.disabled = false;
    }
});
</script>


</body>

</html>
