<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SetMaker | Create Account</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body class="login-body">

    <main class="login-page">

        <div class="login-card">

            <!-- =========================
                 LEFT IMAGE
            ========================== -->

            <section class="login-image">

                <div class="login-image-overlay"></div>

                <div class="login-image-content">

                    <div class="landing-brand">

                        <div class="logo-mark">
                            S
                        </div>

                        <span>SetMaker</span>

                    </div>


                    <div class="login-image-text">

                        <h2>
                            Better Tennis Starts Here
                        </h2>

                        <p>
                            Create your club account and spend less time
                            organising sets and more time on court.
                        </p>

                    </div>

                </div>

            </section>


            <!-- =========================
                 SIGN UP PANEL
            ========================== -->

            <section class="login-panel signup-panel">

                <div class="login-form-wrap signup-form-wrap">

                    <!-- Back -->
                    <a href="{{ url_for('main.home') }}" class="back-home">
                        ← Back to Home
                    </a>


                    <h1>
                        Create your account
                    </h1>

                    <p class="login-subtitle">
                        Set up your SetMaker account and start managing your club.
                    </p>


                    <!-- =========================
                         SIGN UP FORM
                    ========================== -->

                    <form id="signupForm" method="post">

                        <!-- Full Name -->
                        <div class="field">

                            <label for="signupName">
                                Full Name
                            </label>

                            <input type="text" id="signupName" name="name" class="input" placeholder="Your full name"
                                autocomplete="name" required>

                        </div>


                        <!-- Club Name -->
                        <div class="field">

                            <label for="signupClub">
                                Club Name
                            </label>

                            <input type="text" id="signupClub" name="club" class="input" placeholder="Your tennis club"
                                autocomplete="organization" required>

                        </div>


                        <!-- Email -->
                        <div class="field">

                            <label for="signupEmail">
                                Email
                            </label>

                            <input type="email" id="signupEmail" name="email" class="input"
                                placeholder="you@example.com" autocomplete="email" required>

                        </div>


                        <!-- Password -->
                        <div class="field">

                            <label for="signupPassword">
                                Password
                            </label>

                            <input type="password" id="signupPassword" name="password" class="input"
                                placeholder="Create a password" autocomplete="new-password" required>

                        </div>


                        <!-- Confirm Password -->
                        <div class="field">

                            <label for="signupConfirmPassword">
                                Confirm Password
                            </label>

                            <input type="password" id="signupConfirmPassword" name="confirmPassword" class="input"
                                placeholder="Confirm your password" autocomplete="new-password" required>

                        </div>

                        <p id="signup-error" class="form-error" role="alert" hidden></p>

                        <!-- Submit -->
                        <button type="submit" class="btn btn-primary login-submit">
                            Create Account
                        </button>

                    </form>


                    <!-- Existing User -->
                    <p class="signup-login-link">

                        Already have an account?

                        <a href="{{ url_for('auth.login_page') }}">
                            Log In
                        </a>

                    </p>

                </div>

            </section>

        </div>

    </main>


<script>
document.getElementById("signupForm").addEventListener("submit", async function (event) {
    event.preventDefault();

    const form = event.currentTarget;

    const fullName = document.getElementById("signupName").value.trim();
    const clubName = document.getElementById("signupClub").value.trim();
    const email = document.getElementById("signupEmail").value.trim();
    const password = document.getElementById("signupPassword").value;
    const confirmPassword = document.getElementById("signupConfirmPassword").value;

    const errorElement = document.getElementById("signup-error");
    const submitButton = form.querySelector('button[type="submit"]');

    errorElement.hidden = true;
    errorElement.textContent = "";

    // Validate password confirmation
    if (password !== confirmPassword) {
        errorElement.textContent = "Passwords do not match.";
        errorElement.hidden = false;
        return;
    }

    submitButton.disabled = true;

    try {
        // Step 1: Obtain CSRF token
        const csrfResponse = await fetch("{{ url_for('auth.csrf_token') }}", {
            credentials: "same-origin"
        });

        if (!csrfResponse.ok) {
            throw new Error("Unable to obtain a security token.");
        }

        const csrfData = await csrfResponse.json();

        // Step 2: Register a new club and owner
        const response = await fetch("{{ url_for('auth.register') }}", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": csrfData.csrf_token
            },
            credentials: "same-origin",
            body: JSON.stringify({
                full_name: fullName,
                club_name: clubName,
                email: email,
                password: password
            })
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.message || result.error || "Registration failed.");
        }

        // Step 3: Redirect to dashboard
        window.location.href = "{{ url_for('auth.login_page') }}";

    } catch (error) {
        errorElement.textContent = error.message;
        errorElement.hidden = false;

    } finally {
        submitButton.disabled = false;
    }
});
</script>


</body>

</html>
