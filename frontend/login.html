<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SetMaker | Login</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body class="login-body">

    <main class="login-page">

        <!-- Login Card -->
        <div class="login-card">

            <!-- Left Image -->
            <section class="login-image">

                <div class="login-image-overlay"></div>

                <div class="login-image-content">

                    <!-- SetMaker Brand -->
                    <div class="landing-brand">

                        <div class="logo-mark">
                            S
                        </div>

                        <span>SetMaker</span>

                    </div>


                    <!-- Image Text -->
                    <div class="login-image-text">

                        <h2>
                            Welcome Back
                        </h2>

                        <p>
                            Log in to continue creating and managing tennis sessions.
                        </p>

                    </div>

                </div>

            </section>


            <!-- Right Login Panel -->
            <section class="login-panel">

                <div class="login-form-wrap">

                    <!-- Back to Main Page -->
                    <a href="main.html" class="back-home">
                        ← Back to SetMaker
                    </a>


                    <h1>
                        Log In
                    </h1>

                    <p class="login-subtitle">
                        Enter your details to access your account.
                    </p>


                    <!-- Login Form -->
                    <form action="dashboard.html">

                        <!-- Email -->
                        <div class="field">

                            <label for="email">
                                Email
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                class="input"
                                placeholder="you@example.com"
                                required
                            >

                        </div>


                        <!-- Password -->
                        <div class="field">

                            <label for="password">
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="input"
                                placeholder="Enter your password"
                                required
                            >

                        </div>


                        <!-- Login Options -->
                        <div class="login-options">

                            <label class="remember-me">

                                <input
                                    type="checkbox"
                                    name="rememberMe"
                                >

                                Remember me

                            </label>

                            <a href="forgot-password.html">
                                Forgot password?
                            </a>

                        </div>


                        <!-- Login Button -->
                        <button
                            type="submit"
                            class="btn btn-primary login-submit"
                        >
                            Log In
                        </button>

                    </form>

                </div>

            </section>

        </div>

    </main>

</body>

</html>
