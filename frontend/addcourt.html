{% extends "base.html" %}
{% block title %}{{ 'Edit' if court else 'Add' }} Court{% endblock %}
{% block content %}
<main class="main courts-main">
  <div class="page-topline"><h1 class="page-title">{{ 'Edit' if court else 'Add' }} Court</h1></div>
  <div class="card" style="padding:24px;max-width:480px">
    <form method="post" data-api-form action="{{ url_for('api.update_court', court_id=court.id) if court else url_for('api.create_court') }}" data-method="{{ 'PATCH' if court else 'POST' }}" data-redirect="{{ url_for('pages.courts') }}">
      <div class="field"><label for="number">Court Number</label><input class="input" id="number" name="number" type="number" min="1" value="{{ court.number if court else '' }}" required></div>
      <div class="field"><label for="court_type">Surface</label><input class="input" id="court_type" name="court_type" maxlength="80" value="{{ court.court_type if court else '' }}" placeholder="e.g. Hard, Clay, Grass" required></div>
      <div class="field"><label for="priority">Priority</label><input class="input" id="priority" name="priority" type="number" min="0" value="{{ court.priority if court else 0 }}" required></div>
      <label><input name="active" type="checkbox" {{ 'checked' if not court or court.active else '' }}> Active</label>
      <p data-message role="status"></p>
      <div class="form-actions"><a class="btn" href="{{ url_for('pages.courts') }}">Cancel</a><button class="btn btn-primary" type="submit">Save Court</button></div>
    </form>
  </div>
</main>
{% endblock %}
