<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SetMaker | Forgot Password</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body class="login-body">

    <main class="login-page">

        <div class="login-card">

            <!-- Left Image -->
            <section class="login-image">

                <div class="login-image-overlay"></div>

                <div class="login-image-content">

                    <!-- SetMaker Branding -->
                    <div class="landing-brand">

                        <div class="logo-mark">
                            S
                        </div>

                        <span>SetMaker</span>

                    </div>


                    <!-- Image Text -->
                    <div class="login-image-text">

                        <h2>
                            Get Back on Court
                        </h2>

                        <p>
                            Recover access to your SetMaker account
                            and continue managing your tennis sessions.
                        </p>

                    </div>

                </div>

            </section>


            <!-- Forgot Password Panel -->
            <section class="login-panel">

                <div class="login-form-wrap">

                    <!-- Back to Login -->
                    <a href="login.html" class="back-home">
                        ← Back to Log In
                    </a>


                    <!-- Email Icon -->
                    <div class="reset-password-icon">

                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="5" width="18" height="14" rx="2"></rect>

                            <path d="M3 7l9 6 9-6"></path>
                        </svg>

                    </div>


                    <h1>
                        Forgot your password?
                    </h1>

                    <p class="login-subtitle reset-subtitle">
                        Enter the email address associated with your
                        account and we'll send you instructions to reset
                        your password.
                    </p>


                    <!-- Forgot Password Form -->
                    <form id="forgotPasswordForm">

                        <div class="field">

                            <label for="resetEmail">
                                Email
                            </label>

                            <input type="email" id="resetEmail" name="email" class="input" placeholder="you@example.com"
                                autocomplete="email" required>

                        </div>


                        <button type="submit" class="btn btn-primary login-submit">
                            Send Reset Link
                        </button>

                    </form>


                    <!-- Login Link -->
                    <p class="reset-login-link">

                        Remembered your password?

                        <a href="login.html">
                            Log In
                        </a>

                    </p>

                </div>

            </section>

        </div>

    </main>

</body>

</html>
